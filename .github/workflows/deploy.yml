# Публикует сайт в бакет Yandex Object Storage при каждом push в main.
# Нужны секреты репозитория YC_S3_ACCESS_KEY_ID и YC_S3_SECRET_ACCESS_KEY —
# статический ключ сервисного аккаунта с ролью storage.editor.
name: Deploy to Yandex Object Storage

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  BUCKET: bug-hunt.denis-timoshin.ru
  S3_ENDPOINT: https://storage.yandexcloud.net
  AWS_REGION: ru-central1
  AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_ACCESS_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Публикуем только файлы сайта: README, .github и прочее в бакет не попадают
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html 404.html robots.txt sitemap.xml favicon.ico _site/
          # файл подтверждения сайта в Google Search Console — не удалять
          cp google887333dffbabf9cb.html _site/
          cp -R assets _site/assets

      # Картинки меняются редко — кешируем на сутки
      - name: Upload assets
        run: |
          aws s3 sync _site/assets "s3://$BUCKET/assets" \
            --endpoint-url "$S3_ENDPOINT" --delete \
            --cache-control "public, max-age=86400"

      # Страницы — короткий кеш, чтобы обновления игры доходили за минуты
      - name: Upload pages
        run: |
          aws s3 sync _site "s3://$BUCKET" \
            --endpoint-url "$S3_ENDPOINT" --delete \
            --exclude "assets/*" \
            --cache-control "public, max-age=300"

      - name: Check the live site
        run: |
          for path in / /robots.txt /sitemap.xml /assets/og-image.jpg; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$BUCKET$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done
